<!DOCTYPE html>
<html>
<head>
  <title>Benny Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
    #chat { border: 1px solid #ddd; padding: 16px; min-height: 300px; margin-bottom: 12px; }
    .msg { margin: 10px 0; }
    .user { font-weight: bold; }
    .benny { color: #7a2f1d; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px 14px; }
  </style>
</head>
<body>
  <h1>Benny Test</h1>

  <div id="chat"></div>

  <input id="message" placeholder="Ask Benny something" />
  <button onclick="sendMessage()">Send</button>

  <script>
    const history = [];

    function addToChat(role, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<span class="${role === "user" ? "user" : "benny"}">${role === "user" ? "You" : "Benny"}:</span> ${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const message = input.value.trim();
      if (!message) return;

      input.value = "";

      history.push({ role: "user", content: message });
      addToChat("user", message);

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();

      history.push({ role: "assistant", content: data.reply });
      addToChat("assistant", data.reply);
    }
  </script>
</body>
</html>
