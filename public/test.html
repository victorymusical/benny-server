<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benny AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --brand: #7a2f1d;
      --brand-dark: #5f2315;
      --blue: #2563eb;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(122, 47, 29, 0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.10), transparent 30%),
        var(--bg);
      color: var(--text);
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 880px;
      height: calc(100vh - 36px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.92);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), #b45332);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }

    .title strong {
      display: block;
      font-size: 17px;
      line-height: 1.1;
    }

    .title span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      color: #166534;
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin-bottom: 14px;
    }

    .assistant-row {
      justify-content: flex-start;
    }

    .user-row {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 76%;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .assistant-bubble {
      background: white;
      border: 1px solid var(--border);
      border-top-left-radius: 6px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.05);
    }

    .user-bubble {
      background: linear-gradient(135deg, var(--blue), #1d4ed8);
      color: white;
      border-top-right-radius: 6px;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.25);
    }

    .speaker {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .assistant-name {
      color: var(--brand);
    }

    .user-name {
      color: rgba(255,255,255,0.9);
    }

    .message-text {
      white-space: pre-wrap;
    }

    a {
      color: #1d4ed8;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(37, 99, 235, 0.35);
    }

    a:hover {
      border-bottom-color: #1d4ed8;
    }

    .user-bubble a {
      color: white;
      border-bottom-color: rgba(255,255,255,0.5);
    }

    .composer-wrap {
      padding: 14px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 18px;
      padding: 8px;
      transition: 0.15s;
    }

    .composer:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(122, 47, 29, 0.12);
      background: white;
    }

    textarea {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 12px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font: inherit;
      font-size: 15px;
      line-height: 1.35;
      color: var(--text);
    }

    button {
      width: 84px;
      height: 42px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s;
      flex-shrink: 0;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(122, 47, 29, 0.25);
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        background: white;
      }

      .app {
        height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .topbar {
        padding: 12px;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }

      .title strong {
        font-size: 16px;
      }

      .title span {
        font-size: 12px;
      }

      .pill {
        display: none;
      }

      #chat {
        padding: 14px;
      }

      .bubble {
        max-width: 90%;
        font-size: 14.5px;
        padding: 11px 13px;
      }

      .composer-wrap {
        padding: 10px;
      }

      button {
        width: 68px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="identity">
        <div class="avatar">B</div>
        <div class="title">
          <strong>Benny</strong>
          <span>AI product advisor for Victory Musical Instruments</span>
        </div>
      </div>

      <div class="pill">Beta assistant</div>
    </header>

    <section id="chat"></section>

    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="message" placeholder="Ask Benny about instruments, audio, video, or complete setups..."></textarea>
        <button id="sendButton" onclick="sendMessage()">Send</button>
      </div>
    </footer>
  </main>

  <script>
    const history = [];

    const initialGreeting =
      "Hi! My name is Benny, and I’m your AI sales consultant today. Whether you're looking for musical instruments, audio gear, video solutions, or a complete setup, I’ll do my best to guide you in the right direction. What brings you to Victory today?";

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function makeLinksClickable(text) {
      const escaped = escapeHtml(text);

      return escaped.replace(
        /(https?:\/\/[^\s<>()]+)([).,!?])?/g,
        function(match, url, punctuation) {
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${punctuation || ""}`;
        }
      );
    }

    function addToChat(role, text, options = {}) {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = `message-row ${role === "user" ? "user-row" : "assistant-row"}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role === "user" ? "user-bubble" : "assistant-bubble"}`;

      if (options.typing) {
        bubble.innerHTML = `
          <span class="speaker assistant-name">Benny</span>
          <div class="typing"><span></span><span></span><span></span></div>
        `;
        row.id = "typingRow";
      } else {
        const speaker = document.createElement("span");
        speaker.className = `speaker ${role === "user" ? "user-name" : "assistant-name"}`;
        speaker.textContent = role === "user" ? "You" : "Benny";

        const messageText = document.createElement("div");
        messageText.className = "message-text";
        messageText.innerHTML = makeLinksClickable(text);

        bubble.appendChild(speaker);
        bubble.appendChild(messageText);
      }

      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById("typingRow");
      if (typing) typing.remove();
    }

    function addInitialGreeting() {
      history.push({
        role: "assistant",
        content: initialGreeting
      });

      addToChat("assistant", initialGreeting);
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const button = document.getElementById("sendButton");
      const message = input.value.trim();

      if (!message) return;

      input.value = "";
      button.disabled = true;
      button.textContent = "...";

      history.push({
        role: "user",
        content: message
      });

      addToChat("user", message);
      addToChat("assistant", "", { typing: true });

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        removeTyping();

        const reply =
          data.reply ||
          data.error ||
          data.details ||
          "No reply returned.";

        history.push({
          role: "assistant",
          content: reply
        });

        addToChat("assistant", reply);
        console.log(data);

      } catch (error) {
        removeTyping();
        console.error(error);

        addToChat("assistant", "Frontend error communicating with Benny.");
      } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
      }
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    addInitialGreeting();
  </script>
</body>
</html>
