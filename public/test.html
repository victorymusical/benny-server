<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benny Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111827;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 18px;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 4px 0 0;
      color: #5f6b7a;
      font-size: 14px;
    }

    .chat-shell {
      background: #ffffff;
      border: 1px solid #d7dce2;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.07);
      overflow: hidden;
      height: calc(100vh - 92px);
      min-height: 620px;
      display: flex;
      flex-direction: column;
    }

    .chat-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
      flex-shrink: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #7a2f1d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .agent-info strong {
      display: block;
      font-size: 16px;
      color: #111827;
      line-height: 1.2;
    }

    .agent-info span {
      display: block;
      color: #6b7280;
      font-size: 13px;
      margin-top: 2px;
      line-height: 1.3;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #16a34a;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message-row {
      display: flex;
      margin-bottom: 14px;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .message-row.assistant-row {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 76%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .assistant-bubble {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #111827;
      border-top-left-radius: 5px;
    }

    .user-bubble {
      background: #1a73e8;
      color: #ffffff;
      border-top-right-radius: 5px;
    }

    .speaker {
      display: block;
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .assistant-name {
      color: #7a2f1d;
    }

    .user-name {
      color: #ffffff;
    }

    a {
      color: #0b57d0;
      text-decoration: underline;
      word-break: break-word;
    }

    .user-bubble a {
      color: #ffffff;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      min-height: 46px;
      max-height: 120px;
      padding: 12px 14px;
      font-family: Arial, sans-serif;
      font-size: 15.5px;
      line-height: 1.4;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
    }

    textarea:focus {
      border-color: #7a2f1d;
      box-shadow: 0 0 0 3px rgba(122, 47, 29, 0.12);
    }

    button {
      width: 90px;
      border: none;
      border-radius: 10px;
      background: #7a2f1d;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #632615;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .hint {
      color: #6b7280;
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      body {
        background: #ffffff;
      }

      .page {
        max-width: none;
        height: 100vh;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 12px 14px;
        margin: 0;
        display: block;
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
      }

      .header h1 {
        font-size: 24px;
      }

      .header p {
        font-size: 12.5px;
      }

      .hint {
        display: none;
      }

      .chat-shell {
        border-radius: 0;
        border: none;
        box-shadow: none;
        height: auto;
        min-height: 0;
        flex: 1;
      }

      .chat-topbar {
        padding: 11px 14px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        font-size: 16px;
      }

      .agent-info strong {
        font-size: 15px;
      }

      .agent-info span {
        font-size: 12px;
      }

      #chat {
        padding: 14px;
      }

      .bubble {
        max-width: 92%;
        font-size: 14.5px;
        padding: 11px 12px;
      }

      .composer {
        padding: 10px;
        gap: 8px;
      }

      textarea {
        font-size: 15px;
        min-height: 44px;
        padding: 11px 12px;
      }

      button {
        width: 72px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="header">
      <div>
        <h1>Benny Test</h1>
        <p>AI product advisor for instruments, pro audio, video, and studio setup</p>
      </div>

      <div class="hint">
        Enter to send · Shift + Enter for new line
      </div>
    </div>

    <div class="chat-shell">
      <div class="chat-topbar">
        <div class="avatar">B</div>

        <div class="agent-info">
          <strong>Benny</strong>
          <span><span class="status-dot"></span>Ready to help with product selection, setup, and checkout questions</span>
        </div>
      </div>

      <div id="chat"></div>

      <div class="composer">
        <textarea
          id="message"
          placeholder="Ask Benny something..."
        ></textarea>

        <button id="sendButton" onclick="sendMessage()">
          Send
        </button>
      </div>
    </div>
  </div>

  <script>
    const history = [];

    const initialGreeting =
      "Hi! My name is Benny, and I’m your AI sales consultant today. Whether you're looking for musical instruments, audio gear, or video solutions, I’ll do my best to help you find the right solution. What brings you to Victory today?";

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function linkify(text) {
      const escaped = escapeHtml(text);

      return escaped.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    function addToChat(role, text) {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = `message-row ${role === "user" ? "user-row" : "assistant-row"}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role === "user" ? "user-bubble" : "assistant-bubble"}`;

      bubble.innerHTML = `
        <span class="speaker ${role === "user" ? "user-name" : "assistant-name"}">
          ${role === "user" ? "You" : "Benny"}
        </span>
        ${linkify(text)}
      `;

      row.appendChild(bubble);
      chat.appendChild(row);

      chat.scrollTop = chat.scrollHeight;
    }

    function addInitialGreeting() {
      history.push({
        role: "assistant",
        content: initialGreeting
      });

      addToChat("assistant", initialGreeting);
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const button = document.getElementById("sendButton");
      const message = input.value.trim();

      if (!message) return;

      input.value = "";
      button.disabled = true;
      button.textContent = "Sending";

      history.push({
        role: "user",
        content: message
      });

      addToChat("user", message);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        const reply =
          data.reply ||
          data.error ||
          data.details ||
          "No reply returned.";

        history.push({
          role: "assistant",
          content: reply
        });

        addToChat("assistant", reply);

        console.log(data);

      } catch (error) {
        console.error(error);

        addToChat(
          "assistant",
          "Frontend error communicating with Benny."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
      }
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    addInitialGreeting();
  </script>

</body>
</html>
