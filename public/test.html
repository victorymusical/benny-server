<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benny Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111827;
      padding: 12px;
    }

    .benny-widget {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d7dce2;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 620px;
    }

    .benny-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
      flex-shrink: 0;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #7a2f1d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .agent-info {
      flex: 1;
      min-width: 0;
    }

    .agent-info strong {
      display: block;
      font-size: 15px;
      line-height: 1.1;
      color: #111827;
    }

    .agent-info span {
      display: block;
      color: #6b7280;
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #16a34a;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    #chat {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message-row {
      display: flex;
      margin-bottom: 10px;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .message-row.assistant-row {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 9px 11px;
      border-radius: 12px;
      font-size: 14.5px;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .assistant-bubble {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #111827;
      border-top-left-radius: 4px;
    }

    .user-bubble {
      background: #1a73e8;
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .speaker {
      display: block;
      font-weight: 700;
      margin-bottom: 3px;
      font-size: 12px;
    }

    .assistant-name {
      color: #7a2f1d;
    }

    .user-name {
      color: #ffffff;
    }

    .message-text {
      white-space: pre-wrap;
    }

    a {
      color: #0b57d0;
      text-decoration: underline;
      word-break: break-word;
    }

    .user-bubble a {
      color: #ffffff;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 9px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      min-height: 40px;
      max-height: 100px;
      padding: 9px 11px;
      font-family: Arial, sans-serif;
      font-size: 14.5px;
      line-height: 1.3;
      resize: none;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      outline: none;
    }

    textarea:focus {
      border-color: #7a2f1d;
      box-shadow: 0 0 0 2px rgba(122, 47, 29, 0.14);
    }

    button {
      width: 70px;
      border: none;
      border-radius: 9px;
      background: #7a2f1d;
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #632615;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        background: #ffffff;
      }

      .benny-widget {
        max-width: none;
        height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .bubble {
        max-width: 92%;
        font-size: 14px;
      }

      .composer {
        padding: 8px;
      }

      textarea {
        font-size: 14px;
        min-height: 40px;
      }

      button {
        width: 64px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="benny-widget">
    <div class="benny-header">
      <div class="avatar">B</div>

      <div class="agent-info">
        <strong>Benny</strong>
        <span><span class="status-dot"></span>AI product advisor for Victory Musical Instruments</span>
      </div>
    </div>

    <div id="chat"></div>

    <div class="composer">
      <textarea
        id="message"
        placeholder="Ask Benny something..."
      ></textarea>

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>
    </div>
  </div>

  <script>
    const history = [];

    const initialGreeting =
      "Hi! My name is Benny, and I’m your AI sales consultant today. Whether you're looking for musical instruments, audio gear, or video solutions, I’ll do my best to help you find the right solution. What brings you to Victory today?";

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function linkify(text) {
      const escaped = escapeHtml(text);

      return escaped.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    function addToChat(role, text) {
      const chat = document.getElementById("chat");

      const row = document.createElement("div");
      row.className = `message-row ${role === "user" ? "user-row" : "assistant-row"}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role === "user" ? "user-bubble" : "assistant-bubble"}`;

      const speaker = document.createElement("span");
      speaker.className = `speaker ${role === "user" ? "user-name" : "assistant-name"}`;
      speaker.textContent = role === "user" ? "You" : "Benny";

      const messageText = document.createElement("div");
      messageText.className = "message-text";
      messageText.innerHTML = linkify(text);

      bubble.appendChild(speaker);
      bubble.appendChild(messageText);

      row.appendChild(bubble);
      chat.appendChild(row);

      chat.scrollTop = chat.scrollHeight;
    }

    function addInitialGreeting() {
      history.push({
        role: "assistant",
        content: initialGreeting
      });

      addToChat("assistant", initialGreeting);
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const button = document.getElementById("sendButton");
      const message = input.value.trim();

      if (!message) return;

      input.value = "";
      button.disabled = true;
      button.textContent = "...";

      history.push({
        role: "user",
        content: message
      });

      addToChat("user", message);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        const reply =
          data.reply ||
          data.error ||
          data.details ||
          "No reply returned.";

        history.push({
          role: "assistant",
          content: reply
        });

        addToChat("assistant", reply);

        console.log(data);

      } catch (error) {
        console.error(error);

        addToChat(
          "assistant",
          "Frontend error communicating with Benny."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
      }
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    addInitialGreeting();
  </script>

</body>
</html>
