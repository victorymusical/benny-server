<!DOCTYPE html>
<html>
<head>
  <title>Benny Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    #chat {
      border: 1px solid #ccc;
      min-height: 400px;
      padding: 16px;
      margin-bottom: 16px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 14px;
    }

    .user {
      font-weight: bold;
      color: #1a73e8;
    }

    .assistant {
      font-weight: bold;
      color: #7a2f1d;
    }

    input {
      width: 75%;
      padding: 10px;
    }

    button {
      padding: 10px 14px;
    }
  </style>
</head>

<body>

  <h1>Benny Test</h1>

  <div id="chat"></div>

  <input
    id="message"
    placeholder="Ask Benny something..."
  />

  <button onclick="sendMessage()">
    Send
  </button>

  <script>
    const history = [];

    function addMessage(role, text) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.className = "message";

      div.innerHTML = `
        <span class="${role}">
          ${role === "user" ? "You" : "Benny"}:
        </span>
        ${text}
      `;

      chat.appendChild(div);

      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("message");

      const message = input.value.trim();

      if (!message) return;

      input.value = "";

      history.push({
        role: "user",
        content: message
      });

      addMessage("user", message);

      try {

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        const reply =
          data.reply ||
          data.error ||
          data.details ||
          "No reply returned.";

        history.push({
          role: "assistant",
          content: reply
        });

        addMessage("assistant", reply);

        console.log(data);

      } catch (error) {

        console.error(error);

        addMessage(
          "assistant",
          "Frontend error communicating with Benny."
        );
      }
    }
  </script>

</body>
</html>
