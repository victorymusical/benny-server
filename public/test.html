<!DOCTYPE html>
<html>
<head>
  <title>Benny Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    #chat {
      border: 1px solid #ccc;
      min-height: 500px;
      padding: 18px;
      margin-bottom: 16px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .message {
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .user {
      font-weight: bold;
      color: #1a73e8;
    }

    .assistant {
      font-weight: bold;
      color: #7a2f1d;
    }

    a {
      color: #0b57d0;
      text-decoration: underline;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      resize: vertical;
    }

    button {
      padding: 0 22px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Benny Test</h1>

  <div id="chat"></div>

  <div class="input-row">
    <textarea
      id="message"
      placeholder="Ask Benny something..."
    ></textarea>

    <button onclick="sendMessage()">
      Send
    </button>
  </div>

  <script>
    const history = [];

    const initialGreeting =
      "Hi! My name is Benny, and I’m your AI sales consultant today. Whether you're looking for musical instruments, audio gear, or video solutions, I’ll do my best to help you find the right solution. What brings you to Victory today?";

    function linkify(text) {
      return String(text).replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    function addToChat(role, text) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.className = "message";

      div.innerHTML = `
        <span class="${role === "user" ? "user" : "assistant"}">
          ${role === "user" ? "You" : "Benny"}:
        </span>
        ${linkify(text)}
      `;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addInitialGreeting() {
      history.push({
        role: "assistant",
        content: initialGreeting
      });

      addToChat("assistant", initialGreeting);
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const message = input.value.trim();

      if (!message) return;

      input.value = "";

      history.push({
        role: "user",
        content: message
      });

      addToChat("user", message);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        const reply =
          data.reply ||
          data.error ||
          data.details ||
          "No reply returned.";

        history.push({
          role: "assistant",
          content: reply
        });

        addToChat("assistant", reply);

        console.log(data);

      } catch (error) {
        console.error(error);

        addToChat(
          "assistant",
          "Frontend error communicating with Benny."
        );
      }
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    addInitialGreeting();
  </script>

</body>
</html>
